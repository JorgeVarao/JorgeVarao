<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Fluxo: dados brutos, limpeza e ETL, painel ou agente de IA, decisão mais rápida">
  <defs>
    <style>
      .t { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .s { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #fff; fill-opacity: .8; text-anchor: middle; dominant-baseline: central; }
      .flow { fill: none; stroke: #8b949e; stroke-opacity: .7; stroke-width: 2.5; stroke-dasharray: 6 8; stroke-linecap: round; animation: dash 1.2s linear infinite; }
      .node { animation: pulse 3.6s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .82; } }
    </style>
  </defs>

  <path id="p1" class="flow" d="M170,110 L250,110"/>
  <path id="p2" class="flow" d="M400,110 C450,110 450,50 500,50"/>
  <path id="p3" class="flow" d="M400,110 C450,110 450,170 500,170"/>
  <path id="p4" class="flow" d="M650,50 C690,50 690,110 730,110"/>
  <path id="p5" class="flow" d="M650,170 C690,170 690,110 730,110"/>

  <g fill="#FFB400" stroke="#fff" stroke-width="1.5">
    <circle r="5"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.8s" begin="-0.3s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.8s" begin="-0.9s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.6s" begin="-0.6s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.6s" begin="-1.2s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
  </g>

  <g class="node">
    <rect x="20" y="80" width="150" height="60" rx="14" fill="#4285F4"/>
    <text class="t" x="95" y="102">Dados brutos</text>
    <text class="s" x="95" y="123">planilhas e sistemas</text>
  </g>
  <g class="node" style="animation-delay:.4s">
    <rect x="250" y="80" width="150" height="60" rx="14" fill="#EA4B71"/>
    <text class="t" x="325" y="102">Limpeza e ETL</text>
    <text class="s" x="325" y="123">n8n · Apps Script</text>
  </g>
  <g class="node" style="animation-delay:.8s">
    <rect x="500" y="20" width="150" height="60" rx="14" fill="#7B61FF"/>
    <text class="t" x="575" y="42">Painéis</text>
    <text class="s" x="575" y="63">Looker · Power BI</text>
  </g>
  <g class="node" style="animation-delay:1.2s">
    <rect x="500" y="140" width="150" height="60" rx="14" fill="#7B61FF"/>
    <text class="t" x="575" y="162">Agentes de IA</text>
    <text class="s" x="575" y="183">RAG · WhatsApp</text>
  </g>
  <g class="node" style="animation-delay:1.6s">
    <rect x="730" y="80" width="150" height="60" rx="14" fill="#2EA44F"/>
    <text class="t" x="805" y="102">Decisão</text>
    <text class="s" x="805" y="123">mais rápida</text>
  </g>
</svg>
